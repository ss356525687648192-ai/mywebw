
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Card - รักรออยู่ไม่ไกล</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap');

        :root {
            --pink-bg: #ffe4e1;
            --pink-envelope: #ff85a2;
            --pink-flap: #ff5d8f;
            --pink-paper: #ffffff;
            --text-color: #d63384;
        }

        body {
            margin: 0;
            background-color: var(--pink-bg);
            font-family: 'Kanit', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* หัวใจโปรย */
        .heart {
            position: absolute;
            color: #ffb6c1;
            top: -20px;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 0;
        }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }

        /* คอนเทนเนอร์หลัก */
        .letter-container {
            position: relative;
            width: 320px;
            height: 220px;
            z-index: 10;
        }

        /* ตัวซองจดหมาย */
        .envelope {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: var(--pink-envelope);
            border-radius: 0 0 15px 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            z-index: 30; 
            cursor: pointer;
        }

        /* ฝาซอง */
        .flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 130px solid var(--pink-flap);
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 40;
            pointer-events: none;
        }

        /* แอนิเมชันเปิดซอง */
        .letter-container.open .flap {
            transform: rotateX(180deg);
            z-index: 5;
        }

        /* แผ่นกระดาษ */
        .card-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 290px;
            height: 420px;
            perspective: 1000px;
            z-index: 20;
            transition: all 1s ease;
            opacity: 0;
            pointer-events: none;
        }

        /* เลื่อนออกมาหน้าซอง */
        .letter-container.open .card-container {
            opacity: 1;
            bottom: -50px;
            z-index: 50; 
            pointer-events: auto;
            transform: translateX(-50%) translateY(-100px);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            background: var(--pink-paper);
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #fff;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #fffafa;
        }

        h1 { color: #ff477e; font-size: 24px; margin: 0; }
        p { font-size: 15px; line-height: 1.6; color: #555; }
        
        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin: 15px 0;
        }
        .photo-placeholder {
            width: 100%;
            height: 85px;
            background: #fce4ec;
            border-radius: 10px;
            object-fit: cover;
        }

        .music-player {
            width: 100%;
            padding: 10px;
            background: #fff0f3;
            border-radius: 30px;
            font-size: 13px;
            color: #ff477e;
            text-align: center;
        }

        .hint { font-size: 11px; color: #ff85a2; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <audio id="bgMusic" preload="auto"playsinline loop>
        <source src="img/336.mp3" type="audio/mpeg">
    </audio>

    <div class="letter-container" id="letterBox">
        <div class="flap"></div>
        
        <div class="envelope" id="mainEnvelope" onclick="startOpening()">
          <br>
            <br>
            <p style="text-align: center; color: white; margin-top: 90px; font-weight: 500;">จาก น้องน็อต สุดหล่ออ ❤️</p>
        </div>

        <div class="card-container" id="cardContainer">
            <div class="card-inner" id="cardInner" onclick="toggleFlip()">
                <div class="card-front">
                    <h1>Happy Birthday</h1>
                    <h4 style="color: #ff85a2; margin-top: 5px;">วนัชพร บุญเจริญ</h4>
                    <p>ขอบคุณนะที่อยู่ด้วยกันมาตลอดช่วงที่ผ่านมา เรามีเรื่องให้ยิ้มตามเยอะกว่าที่คิดไว้มากจริงๆ</p>
                    <div class="hint">แตะกระดาษเพื่อดูหน้าหลัง ✨</div>
                </div>

                <div class="card-back">
                    <h2 style="color: #ff477e;">รักนะ</h2>
                    <div class="photo-grid">
                        <img src="img/111.jpg" class="photo-placeholder">
                        <img src="img/112.jpg" class="photo-placeholder">
                    </div>
                    <div class="music-player">
                        🎵 รักรออยู่ไม่ไกล...(wind)-PURPEECH [Official MV]
                    </div>
                    <div class="hint">แตะเพื่อพลิกกลับ ✨</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 400);

        function startOpening() {
            const box = document.getElementById('letterBox');
            const music = document.getElementById('bgMusic');
        
            
            box.classList.add('open');
            
            // ปรับระดับเสียงและเริ่มเล่น
            music.volume = 1.0; 
            music.play().catch(error => {
                console.log("Playback failed:", error);
            });

            document.getElementById('mainEnvelope').style.pointerEvents = 'none';
        }

        function toggleFlip() {
            const card = document.getElementById('cardInner');
            card.classList.toggle('flipped');
        }
    </script>
</body>
</html>
